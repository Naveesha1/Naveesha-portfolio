services:
  - type: web
    name: naveesha-portfolio
    runtime: node
    plan: starter
    buildCommand: npm install && npm --prefix server install && PUBLIC_URL=/ CI=false npm run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
